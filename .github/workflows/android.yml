name: "[Auto] Build Android TV APK"

on:
  push:
    branches:
      - master
    paths:
      # The APK only embeds a WebView, so it is rebuilt when the app itself or
      # its version changes -- not on every frontend commit.
      - "android/**"
      - "scripts/build-android.js"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Decode keystore
        # Optional: without these secrets the APK is signed with the debug key,
        # which is fine for sideloading on your own devices. The secret is read
        # through env because the secrets context is not usable in `if`.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/navis-tv.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/navis-tv.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: npm run build:android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: navis-tv-${{ steps.version.outputs.version }}
          path: bin/navis-tv-*.apk
          if-no-files-found: error

      - name: Attach APK to release
        # Publishes the APK on the tag matching the current version when it exists,
        # so the TV app is downloadable next to the web release.
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Navis v${{ steps.version.outputs.version }}
          files: bin/navis-tv-*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
